name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Guardrails: cap turns to keep runs bounded/cheap, raise only if legitimately truncated.
          # Model is pinned so this doesn't silently change when defaults shift.
          # Raised from 8 -> 15 after issue #2's first run hit the ceiling mid-task
          # (read issue, locate code, edit, lint, build, commit, push, open PR left no room for error).
          #
          # allowedTools is additive to the action's default tag-mode tools (Read/Grep/Glob/LS,
          # git add/commit/push). Without an explicit Edit grant and scoped npm commands, the agent
          # cannot make or verify any code change at all - issue #2's second run burned its whole
          # turn budget on permission denials before it ever touched a file.
          # npm run lint/build are scoped with exact command matches (not `npm run *`) so this can
          # never reach `npm run db:migrate`/`db:generate`, which stay off-limits per web/CLAUDE.md.
          claude_args: |
            --max-turns 15
            --model claude-sonnet-5
            --allowedTools "Edit,Bash(cd:*),Bash(npm run lint:*),Bash(npm run build:*)"

